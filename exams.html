<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Exam Planner | Study Tracker</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <nav>
        <a href="index.html">Home</a>
        <a href="today.html">Today</a>
        <a href="profile.html">Academic Profile</a>
        <a href="syllabus.html">Syllabus</a>
        <a href="exams.html">Exams</a>
        <a href="progress.html">Progress</a>
        <a href="ideal.html">Ideal</a>
        <a href="analysis.html">Analysis</a>
        <a href="forecast.html">Forecast</a>
    </nav>
    <main class="container">
        <h1>Exam Planner</h1>
        <p>Keep track of upcoming exams, dates and priorities.</p>
        <section class="card">
            <h2>Add an Exam</h2>
            <form id="examForm">
                <label for="examTitle">Exam title</label>
                <input id="examTitle" maxlength="150" required placeholder="e.g. Computer Networks Sessional">
                <label for="examSubject">Subject</label>
                <select id="examSubject" required></select>
                <label for="examDate">Exam date</label>
                <input id="examDate" type="date" required>
                <label for="examPriority">Priority</label>
                <select id="examPriority">
                    <option value="low">Low</option>
                    <option value="medium" selected>Medium</option>
                    <option value="high">High</option>
                </select>
                <label for="examDescription">Notes (optional)</label>
                <textarea id="examDescription" rows="3"></textarea>
                <button type="submit">Add Exam</button>
            </form>
            <p id="examMessage" class="status-message" role="status" aria-live="polite"></p>
        </section>
        <section class="card">
            <h2>Your Exams</h2>
            <div class="filter-row">
                <label for="examFilter">Show</label>
                <select id="examFilter">
                    <option value="all">All exams</option>
                    <option value="true">Upcoming exams</option>
                    <option value="false">Past exams</option>
                </select>
            </div>
            <div id="examList" class="item-list"></div>
        </section>
    </main>
    <script src="api-config.js"></script>
    <script src="script.js"></script>
    <script src="academic.js"></script>
</body>
</html>
