name: Render health ping

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Check Render API health
        env:
          HEALTH_URL: ${{ vars.RENDER_HEALTH_URL }}
        run: |
          HEALTH_URL="${HEALTH_URL:-https://study-tracker-backend-lt40.onrender.com/api/health/}"
          echo "Checking ${HEALTH_URL}"
          curl --fail --silent --show-error --max-time 20 "$HEALTH_URL"
