name: Frontend CI

on:
  push:
    branches: [main]
    paths:
      - "*.html"
      - "*.js"
      - "*.css"
      - "package.json"
      - "tests/**"
      - ".github/workflows/frontend-ci.yml"
  pull_request:
    paths:
      - "*.html"
      - "*.js"
      - "*.css"
      - "package.json"
      - "tests/**"
      - ".github/workflows/frontend-ci.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm test
